name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout patches
      uses: actions/checkout@v4
      with:
        ref: build
        path: patches
    - name: check file
      run: |
        cat patches/build.sh
    
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: LineageOS/android_kernel_oneplus_sm8350
        ref: lineage-21
        path: sm8350
        fetch-depth: 100

    - name: Checkout gcc toolchain
      uses: actions/checkout@v4
      with:
        repository: mvaisakh/gcc-arm64
        ref: 05cb20a52f12389c3f2340b5103485108feae302
        path: toolchain

    - name: Android kernel build
      run: |
        sudo apt install libdebuginfod-dev
        export PATH="$(pwd)/toolchain/bin:${PATH}"
        cp patches/build.sh sm8350/build.sh && cp patches/mkdtboimg.py sm8359/mkdtboimg.py && cd sm8350 && bash build.sh
        git log --no-decorate --oneline -n 100 > out/ak3/ChangeLog.txt

    - name: Upload final output
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: |
          sm8350/out/ak3/ChangeLog.txt
          sm8350/out/ak3/*.zip
